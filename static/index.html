<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Coach</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <p class="label">Current exercise</p>
    <h1 id="current">Tap to talk to begin</h1>

    <button id="talk" class="talk">Tap to talk</button>
    <button id="hands-free" class="secondary" aria-pressed="false" disabled>Hands-free: OFF</button>
    <p id="status" class="status">Hands-free off</p>
    <p id="unsupported" class="warning" hidden>
      Voice input isn't supported in this browser. Please use Chrome or Edge,
      or type below.
    </p>

    <section class="conversation">
      <p><span class="label">You said:</span> <span id="heard">...</span></p>
      <p><span class="label">Understood by:</span> <span id="source">...</span></p>
      <p><span class="label">Coach:</span> <span id="reply">...</span></p>
    </section>

    <form id="text-form">
      <input id="text" type="text" placeholder="e.g. 60 kilos, 8 reps" autocomplete="off">
      <button type="submit">Send</button>
    </form>

    <h2>Session log</h2>
    <table id="log"></table>

    <button id="reset" class="secondary">New session</button>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
